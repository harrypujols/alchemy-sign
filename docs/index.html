<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="img/favicon.ico"  href="assets/img/favicon.ico"/>
    <title>Alchemy Zodiac Sign Calculator</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script defer src="js/scripts.js"></script>
  </head>
  <body class="body">
    <main class="main ">
      <div class="container">
        

<div
  data-js="alchemy"
  class="alchemy-form"
  id="alchemy-form">
  <div
    role="img"
    aria-label="Alchemy element icon"
    aria-hidden="true"
    class="icon-holder"
    data-js="include"
    data-file="./assets/img/philosophers-stone.svg"></div>
  <h1 class="huge">Alchemy Zodiac Sign Calculator</h1>
  <label for="input" class="birth-label">Enter date</label>
  <input
    required
    type="date"
    id="input"
    class="birth-input" />
  <button
    type="submit"
    class="birth-button button"
    id="submit">
    Get Sign
  </button>
</div>
<div id="alchemy-results" class="alchemy-results hidden">
  <section id="placeholder" class="results"></section>
  <button class="reset-button button hidden" id="reset">Return</button>
</div>

<template id="template">
  <article class="results-container">
    <div
      role="img"
      aria-label="Alchemy element icon"
      aria-hidden="true"
      class="icon-holder"
      data-js="include"
      data-file="./assets/img/{= data.element =}.svg"></div>
    <p class="results-date">
      The date is
      <span class="birthdate">{= data.date =}</span>
    </p>

    <h1 class="results-element huge">
      Your alchemy element is
      <span class="element {= data.element =}">{= data.element =}</span>
    </h1>
    <p class="results-planet">
      Planetarily aligned to
      <a
        href="zodiac.html#{= data.element =}"
        class="planet {= data.planet =}"
        target="_blank">{= data.planet =}</a>
    </p>
  </article>
</template>
      </div>
    </main>
  </body>
</html>
